# Simplified version of integration.yml for fork-to-fork PoC
# Drop this into your fork's .github/workflows/integration.yml
# It removes the AWS OIDC step (which won't work on a fork) and
# instead proves secret access via a dummy POC_SECRET.

name: Integration Tests

on:
  pull_request_target:
    types: [labeled]

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  functional-tests-pr:
    name: Functional Tests - PR
    if: contains(github.event.pull_request.labels.*.name, 'enable-functional-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Base repo secrets — attacker's code should NOT see these
      POC_SECRET: ${{ secrets.POC_SECRET }}

    steps:
      # THIS IS THE VULNERABILITY:
      # pull_request_target runs with BASE repo context (secrets, GITHUB_TOKEN)
      # but checks out the FORK's code (attacker-controlled)
      - name: Check out the repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      # Attacker's code executes here with secrets in env
      - name: Run tests (attacker code runs here)
        run: |
          python -m pytest poc_tests/test_security_canary.py -v -s

      - name: Upload canary results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-canary-results
          path: /tmp/security-canary/
